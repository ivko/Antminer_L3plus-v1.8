# meta-antminer: Antminer BB-Black V1.8 as a generic Modbus / OpenPLC I/O module
BBPATH .= ":${LAYERDIR}"
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "antminer"
BBFILE_PATTERN_antminer = "^${LAYERDIR}/"
BBFILE_PRIORITY_antminer = "10"

LAYERDEPENDS_antminer = "core openembedded-layer"
LAYERSERIES_COMPAT_antminer = "scarthgap"

# repo/mainline: the kernel recipe takes dts/am335x-antminer.dts and kernel/defconfig from here,
# so there is exactly one copy of both (the same files build-kernel.sh uses for netboot tests).
ANTMINER_MAINLINE_DIR = "${LAYERDIR}/../.."
