require conf/distro/poky.conf

DISTRO = "antminer"
DISTRO_NAME = "Antminer I/O Module"
DISTRO_VERSION = "0.1"
DISTRO_CODENAME = "scarthgap"
MAINTAINER = "ivko"

# busybox init + mdev, glibc, ipk packages
INIT_MANAGER = "mdev-busybox"
# Strong assignments: packagegroup-core-boot uses "?=" defaults (udev, sysvinit...) that would
# override the weak "??=" of init-manager-mdev-busybox.inc and pull eudev into the image.
VIRTUAL-RUNTIME_dev_manager = "busybox-mdev"
VIRTUAL-RUNTIME_init_manager = "busybox"
VIRTUAL-RUNTIME_initscripts = "initscripts"
VIRTUAL-RUNTIME_login_manager = "busybox"
VIRTUAL-RUNTIME_base-utils-syslog = "busybox-syslog"
TCLIBC = "glibc"
PACKAGE_CLASSES = "package_ipk"

# minimal feature set: no graphics, no sound, no usb, no ipv6, no wireless.
# "sysvinit" here only makes update-rc.d install the /etc/rcS.d symlinks that busybox's rcS runs;
# the init binary stays busybox (VIRTUAL-RUNTIME_init_manager above).
DISTRO_FEATURES = "ipv4 largefile sysvinit"
DISTRO_FEATURES_BACKFILL_CONSIDERED:append = " pulseaudio gobject-introspection-data ldconfig"
IMAGE_LINGUAS = ""

# keep the sstate/downloads shareable between builds
SDKMACHINE ?= "x86_64"
