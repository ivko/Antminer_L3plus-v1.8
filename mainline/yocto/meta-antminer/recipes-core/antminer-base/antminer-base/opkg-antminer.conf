# opkg on the I/O module: the root is either a ramfs or an overlay on the 185 MB UBIFS data
# partition. Downloaded .ipk files are already compressed, so caching them on UBIFS costs real
# space (80 MB for the OpenPLC set). Keep the download cache on the tmpfs and drop it after
# every operation.
option cache_dir /var/volatile/cache/opkg
option volatile_cache 1
