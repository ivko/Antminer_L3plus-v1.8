# Settings of the PC that drives the boards. Used by tools/antminer.py (and FEED_HOST of the build).
# Do not edit for one machine: put overrides in site.local.conf next to this file (not in git),
# or set environment variables ANTMINER_<KEY> (e.g. ANTMINER_SERIAL_PORT=/dev/ttyUSB0).

# IP of this PC in the boards' network (TFTP and opkg feed server). Empty = detect automatically.
PC_IP=

# USB-serial adapter on the board console (Windows: COM3, Linux: /dev/ttyUSB0)
SERIAL_PORT=COM3

# HTTP port of the opkg feed server
FEED_PORT=8000

# Yocto build tree inside WSL / on Linux (the feed is served from <YOCTO_DIR>/build/tmp/deploy)
YOCTO_DIR=~/antminer/yocto

# root password on the board console: empty for the Yocto images, "admin" for the old Bitmain system
BOARD_PASSWORD=
