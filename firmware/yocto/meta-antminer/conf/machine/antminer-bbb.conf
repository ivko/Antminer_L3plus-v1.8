#@TYPE: Machine
#@NAME: Antminer BB-Black V1.8 (TI AM3352, 256 MiB DDR3, 256 MiB NAND)
#@DESCRIPTION: Bitmain L3+ controller board reused as an I/O module. Boots the stock
#  U-Boot 2013.04 from NAND; kernel (uImage) in mtd7, initramfs (cpio.gz.u-boot) in mtd8,
#  per-board DTB in mtd6. No USB, no EEPROM, no SD root.

require conf/machine/include/arm/armv7a/tune-cortexa8.inc
DEFAULTTUNE = "cortexa8hf-neon"

MACHINE_FEATURES = "ethernet"
SERIAL_CONSOLES = "115200;ttyS0"
USE_VT = "0"

PREFERRED_PROVIDER_virtual/kernel = "linux-antminer"
KERNEL_IMAGETYPE = "uImage"
KERNEL_DEVICETREE = "ti/omap/am335x-antminer.dtb"
UBOOT_ARCH = "arm"
UBOOT_LOADADDRESS = "0x80008000"
UBOOT_ENTRYPOINT = "0x80008000"
# KEEPUIMAGE defaults to "yes" on ARM: the kernel's own "make uImage" wraps the XZ zImage with
# mkimage and needs LOADADDR for a multiplatform kernel (same as build-kernel.sh does by hand)
KERNEL_EXTRA_ARGS = "LOADADDR=${UBOOT_LOADADDRESS}"

# initramfs wrapped as a U-Boot legacy ramdisk image, exactly what "bootm kernel initrd fdt" wants
# (the "u-boot" conversion is part of image_types.bbclass in scarthgap)
IMAGE_FSTYPES = "cpio.gz.u-boot cpio.gz"

# everything needed is built into the kernel; no module tarball, no modules in the initramfs
MACHINE_EXTRA_RRECOMMENDS = ""
MODULE_TARBALL_DEPLOY = "0"
